# OpenOCD config: Raspberry Pi Pico 2 W running debugprobe (CMSIS-DAP) -> Huntsman Mini STM32L151RCT6 via J1.
# Pico GP2 = SWCLK, GP3 = SWDIO, GP1 = nRESET (optional), GND = GND. Keyboard powered by its own USB cable.
source [find interface/cmsis-dap.cfg]
transport select swd
adapter speed 400

source [find target/stm32l1.cfg]

# Wire GP1 to J1 nRESET to allow connect-under-reset (needed if the chip is stuck in a fault/low-power loop).
# reset_config srst_only srst_nogate connect_assert_srst
reset_config none
